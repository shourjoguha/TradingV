<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e3e8ee"/>
      <stop offset="100%" stop-color="#cfd5de"/>
    </radialGradient>
    <linearGradient id="forecast" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6464ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#6464ff" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#6464ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6464ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="context" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38b3a1" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38b3a1" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#38b3a1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38b3a1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="focal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b96a"/>
      <stop offset="60%" stop-color="#d4a44a"/>
      <stop offset="100%" stop-color="#d4a44a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3d4654" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#dots)"/>

  <!-- Forecast pipeline flow (top arc) -->
  <path d="M 60,140 C 280,140 380,140 500,170 S 780,200 950,240"
        fill="none" stroke="url(#forecast)" stroke-width="3" stroke-linecap="round"/>
  <!-- Sub-flow ghost lines for movement -->
  <path d="M 60,130 C 280,130 380,130 500,160 S 780,190 950,232"
        fill="none" stroke="#6464ff" stroke-opacity="0.15" stroke-width="1"/>
  <path d="M 60,150 C 280,150 380,150 500,180 S 780,210 950,248"
        fill="none" stroke="#6464ff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Context layer flow (bottom arc) -->
  <path d="M 60,340 C 280,340 380,340 500,310 S 780,280 950,240"
        fill="none" stroke="url(#context)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 60,330 C 280,330 380,330 500,300 S 780,270 950,232"
        fill="none" stroke="#38b3a1" stroke-opacity="0.15" stroke-width="1"/>
  <path d="M 60,350 C 280,350 380,350 500,320 S 780,290 950,248"
        fill="none" stroke="#38b3a1" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Forecast pipeline stops -->
  <g fill="#6464ff">
    <circle cx="150" cy="140" r="6"/>
    <circle cx="320" cy="140" r="6"/>
    <circle cx="490" cy="170" r="6"/>
    <circle cx="680" cy="190" r="6"/>
    <circle cx="830" cy="220" r="6"/>
  </g>
  <g font-size="13" fill="#3d4654" font-weight="500" text-anchor="middle">
    <text x="150" y="118">Watchlist</text>
    <text x="320" y="118">Predictions</text>
    <text x="490" y="148">Accuracy</text>
    <text x="680" y="168">Drift</text>
    <text x="830" y="198">Signals</text>
  </g>

  <!-- Context layer stops -->
  <g fill="#38b3a1">
    <circle cx="150" cy="340" r="6"/>
    <circle cx="320" cy="340" r="6"/>
    <circle cx="490" cy="310" r="6"/>
    <circle cx="680" cy="290" r="6"/>
    <circle cx="830" cy="260" r="6"/>
  </g>
  <g font-size="13" fill="#3d4654" font-weight="500" text-anchor="middle">
    <text x="150" y="365">TV Context</text>
    <text x="320" y="365">Hypotheses</text>
    <text x="490" y="335">Vault</text>
    <text x="680" y="315">Research</text>
    <text x="830" y="285">The Street</text>
  </g>

  <!-- Focal node: rx finance -->
  <circle cx="1010" cy="240" r="70" fill="url(#focal)"/>
  <circle cx="1010" cy="240" r="32" fill="#d4a44a" filter="url(#softshadow)"/>
  <circle cx="1010" cy="240" r="32" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="1010" y="237" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" letter-spacing="0.5">rx</text>
  <text x="1010" y="253" font-size="10" fill="#fff" text-anchor="middle" letter-spacing="1">FINANCE</text>

  <!-- Headers -->
  <text x="60" y="50" font-size="11" fill="#6c737f" letter-spacing="2" font-weight="600">FORECAST PIPELINE</text>
  <text x="60" y="68" font-size="22" fill="#3d4654" font-weight="700">The numbers half</text>
  <text x="60" y="85" font-size="13" fill="#6c737f">Daily Kronos forecasts → rules → signals</text>

  <text x="60" y="425" font-size="11" fill="#6c737f" letter-spacing="2" font-weight="600">CONTEXT LAYER</text>
  <text x="60" y="443" font-size="22" fill="#3d4654" font-weight="700">The narrative half</text>
  <text x="60" y="460" font-size="13" fill="#6c737f">What you're paying attention to</text>

  <!-- Right side meeting label -->
  <text x="1090" y="183" font-size="11" fill="#6c737f" letter-spacing="2" font-weight="600">CONVERGE AT</text>
  <text x="1090" y="200" font-size="14" fill="#3d4654" font-weight="700">One ranked rec / day</text>
</svg>
