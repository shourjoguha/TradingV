services:
  postgres:
    image: postgres:16-alpine
    container_name: tradingview-laptop-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradingview
      POSTGRES_PASSWORD: qjcOg7j-K5GoPrFrC6AhUgr3EGBFqKjz
      POSTGRES_DB: tradingview
    ports:
      - "5439:5432"
    volumes:
      - tradingview_laptop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingview"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tradingview_laptop_pg:
